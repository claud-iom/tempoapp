<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tempo</title>
  <meta name="description" content="See how busy a place is before you go. Tempo is a live check of the night, from Tempo Check LLC.">
  <meta name="theme-color" content="#e7dfd2">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="stage">
    <div class="sky" aria-hidden="true">
      <span class="road r1"></span>
      <span class="road r2"></span>
      <span class="road r3"></span>
      <span class="road r4"></span>
      <span class="road r5"></span>
      <span class="pin packed" style="top: 22%; left: 14%"></span>
      <span class="pin busy" style="top: 30%; left: 27%"></span>
      <span class="pin building" style="top: 18%; left: 41%"></span>
      <span class="pin quiet" style="top: 36%; left: 52%"></span>
      <span class="pin packed" style="top: 24%; left: 67%"></span>
      <span class="pin busy" style="top: 16%; left: 78%"></span>
      <span class="pin quiet" style="top: 48%; left: 18%"></span>
      <span class="pin building" style="top: 56%; left: 34%"></span>
      <span class="pin packed" style="top: 46%; left: 61%"></span>
      <span class="pin busy" style="top: 62%; left: 73%"></span>
      <span class="pin quiet" style="top: 70%; left: 48%"></span>
      <span class="pin building" style="top: 40%; left: 86%"></span>
    </div>
    <div class="bar">
      <p class="brand">Tempo</p>
    </div>
  </header>

  <main>
    <section class="lead">
      <p class="kicker">Tempo Check LLC</p>
      <h1>A live check of the night.</h1>
    </section>

    <section class="meter-block">
      <ol class="meter">
        <li class="quiet">
          <span class="dots" aria-hidden="true"><i></i><i class="off"></i><i class="off"></i><i class="off"></i></span>
          <span class="name">Quiet</span>
        </li>
        <li class="building">
          <span class="dots" aria-hidden="true"><i></i><i></i><i class="off"></i><i class="off"></i></span>
          <span class="name">Building</span>
        </li>
        <li class="busy">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i class="off"></i></span>
          <span class="name">Busy</span>
        </li>
        <li class="packed">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="name">Packed</span>
        </li>
      </ol>
      <p class="blank"><span class="dots" aria-hidden="true"><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></span>No recent check after 90 minutes.</p>
    </section>

    <section class="block">
      <div class="purpose-copy">
        <p class="purpose">See how busy a place is before you go.</p>
        <p class="purpose-note">Someone there posts Quiet, Building, Busy, or Packed.</p>
      </div>
      <div class="phones">
        <figure>
          <img src="images/map.jpg" alt="The Tempo map on 2nd Street. Colored pins show how busy each place is, and the list starts underneath.">
          <figcaption>The map</figcaption>
        </figure>
        <figure>
          <img src="images/place.jpg" alt="Shannon's Bayshore open in Tempo: Packed, 8 minutes ago, with the checks people posted.">
          <figcaption>A place</figcaption>
        </figure>
      </div>
    </section>

    <footer>
      <p class="brand">Tempo</p>
      <address>
        <a href="mailto:admin@tempoapp.us">admin@tempoapp.us</a>
        <span>Los Angeles</span>
      </address>
    </footer>
  </main>
</body>
</html>
